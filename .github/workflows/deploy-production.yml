# Manual production release of the web app. Builds the given commit with the PRODUCTION build
# settings (Next.js bakes them in), pushes construction-web:production-<sha> and deploys it.
# Rollback = run it again with an older commit, or on the server:
#   ./deploy.sh --web production-<old sha> --no-migrate
#
# Repository → Settings → Environments → "production": required reviewers (protection rule), deployment
# branches limited to main; same secrets / variables as "staging" with the production values
# (API_PUBLIC_URL=https://api.example.pk, PRODUCTION_URL=https://app.example.pk).
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit sha (or branch) to release, normally the sha running on staging"
        required: true
        type: string
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-web
  cancel-in-progress: false

jobs:
  production:
    name: Build, push & deploy ${{ inputs.ref }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/construction' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Image name and tag
        id: vars
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/construction-web" >> "$GITHUB_OUTPUT"
          echo "tag=production-${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:production
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
            API_ORIGIN=http://api:4000
            API_PUBLIC_URL=${{ vars.API_PUBLIC_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.vars.outputs.tag }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_RELEASE=construction-web@${{ steps.vars.outputs.sha }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=web-production
          cache-to: type=gha,mode=max,scope=web-production

      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (pull, restart, readiness)
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$TARGET" "'$DEPLOY_PATH/deploy.sh' --web '$TAG' --no-migrate"
